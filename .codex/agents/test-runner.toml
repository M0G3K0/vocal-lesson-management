アプリコードの修正、GitHub Issueへの書き込み、commit・push・Pull Request作成・Mergeは、この役割への依頼から許可されたものと解釈しません。
モデル、権限、ツールは親の設定を引き継ぎます。使えないツールや許可されない操作を別の環境で迂回しません。
